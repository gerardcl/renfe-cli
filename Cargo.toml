[package]
name = "renfe-cli"
version = "6.2.0"
edition = "2024"
rust-version = "1.98"
authors = ["Gerard C.L. <gerardcl@gmail.com>"]
license = "BSD-3-Clause"
description = "CLI for searching Renfe train timetables in the Spanish country"
readme = "README.md"
homepage = "https://github.com/gerardcl/renfe-cli"
repository = "https://github.com/gerardcl/renfe-cli"
keywords = ["cli", "timetables", "trains", "renfe", "spain"]
categories = ["command-line-utilities"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "renfe_cli"
# https://doc.rust-lang.org/reference/linkage.html
crate-type = ["cdylib", "lib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }
getopts = "0.2.24"
chrono = "0.4.45"
gtfs-structures = { version = "0.50", default-features = false }
jiff = { version = "0.2.35", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
directories = "6.0"
